<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - التقارير الهندسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style/login.css">
</head>

<body>
    <div class="login-box">
        <div class="login-logo"><span class="icon">🏗️</span>
            <h1>التقارير اليومية الهندسية</h1>
            <p>نظام إدارة مواقع البناء</p>
        </div>
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="login-email"
                placeholder="user@example.com"></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="login-password"
                placeholder="••••••••"></div>
        <button class="btn" id="login-btn">تسجيل الدخول</button>
        <div class="error" id="login-error"></div>
    </div>
    <script type="module" src="../script/login.js"></script>
</body>

</html>
